        .navigation__icon::after {
            content: "";

        (() => {
            "use strict";

            /*
              Mystify-style screensaver + pixel shift on specific elements only
              -----------------------------------------------------------------
              Shift targets:
                - #ww_72fada7aac556
                - #clockbox
                - #svg
          
              Behavior:
                - Screensaver runs daily from 3:00 AM to 5:00 PM America/Chicago
                - During active hours, those elements shift subtly every 90 seconds
                - No DOM restructuring, no wrapping, no moving body children
            */

            const CONFIG = {
                timeZone: "America/Chicago",
                screensaverStartHour: 3,
                screensaverEndHour: 17,
                stateCheckIntervalMs: 30 * 1000,

                mystify: {
                    numShapes: 4,
                    pointsPerShape: 4,
                    trailLength: 24,
                    lineWidth: 2.2,
                    speedMin: 2.2,
                    speedMax: 4.8
                },

                shift: {
                    enabled: true,
                    targetIds: ["clockbox"],
                    maxOffsetPx: 3,
                    stepEveryMs: 90 * 1000,
                    transitionMs: 1200
                }
            };

            let overlay = null;
            let canvas = null;
            let ctx = null;
            let animationId = null;
            let resizeHandlerBound = false;
            let activeScreensaver = false;
            let width = 0;
            let height = 0;
            let shapes = [];
            let lastTs = 0;

            let shiftTargets = [];
            let shiftIntervalId = null;
            let currentShiftX = 0;
            let currentShiftY = 0;

            function getLocalHourMinute() {
                const parts = new Intl.DateTimeFormat("en-US", {
                    timeZone: CONFIG.timeZone,
                    hour: "numeric",
                    minute: "numeric",
                    hour12: false
                }).formatToParts(new Date());

                const hour = Number(parts.find(p => p.type === "hour").value);
                const minute = Number(parts.find(p => p.type === "minute").value);

                return { hour, minute };
            }

            function isScreensaverTime() {
                const { hour } = getLocalHourMinute();
                return hour >= CONFIG.screensaverStartHour && hour < CONFIG.screensaverEndHour;
            }

            function rand(min, max) {
                return Math.random() * (max - min) + min;
            }

            function randInt(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            function randSpeed() {
                const speed = rand(CONFIG.mystify.speedMin, CONFIG.mystify.speedMax);
                return Math.random() < 0.5 ? -speed : speed;
            }

            function makePoint() {
                return {
                    x: rand(0, width),
                    y: rand(0, height),
                    vx: randSpeed(),
                    vy: randSpeed()
                };
            }

            function clonePoints(points) {
                return points.map(p => ({ x: p.x, y: p.y }));
            }

            function createShape(index) {
                const hueBase = (index * (360 / CONFIG.mystify.numShapes)) + rand(-15, 15);
                const points = Array.from({ length: CONFIG.mystify.pointsPerShape }, makePoint);
                const trail = [];

                for (let i = 0; i < CONFIG.mystify.trailLength; i++) {
                    trail.push(clonePoints(points));
                }

                return {
                    points,
                    trail,
                    hue: hueBase
                };
            }

            function initShapes() {
                shapes = Array.from({ length: CONFIG.mystify.numShapes }, (_, i) => createShape(i));
            }

            function resizeCanvas() {
                if (!canvas || !ctx) return;

                const dpr = Math.max(1, window.devicePixelRatio || 1);
                width = window.innerWidth;
                height = window.innerHeight;

                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                canvas.style.width = width + "px";
                canvas.style.height = height + "px";

                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                if (!shapes.length) {
                    initShapes();
                } else {
                    for (const shape of shapes) {
                        for (const p of shape.points) {
                            p.x = Math.max(0, Math.min(width, p.x));
                            p.y = Math.max(0, Math.min(height, p.y));
                        }
                        shape.trail = Array.from(
                            { length: CONFIG.mystify.trailLength },
                            () => clonePoints(shape.points)
                        );
                    }
                }
            }

            function ensureOverlay() {
                if (overlay) return;

                overlay = document.createElement("div");
                overlay.id = "mystify-screensaver-overlay";
                overlay.style.position = "fixed";
                overlay.style.inset = "0";
                overlay.style.zIndex = "2147483647";
                overlay.style.background = "black";
                overlay.style.display = "none";
                overlay.style.pointerEvents = "none";
                overlay.style.overflow = "hidden";

                canvas = document.createElement("canvas");
                canvas.style.width = "100%";
                canvas.style.height = "100%";
                canvas.style.display = "block";

                overlay.appendChild(canvas);
                document.body.appendChild(overlay);

                ctx = canvas.getContext("2d");
                resizeCanvas();

                if (!resizeHandlerBound) {
                    window.addEventListener("resize", resizeCanvas);
                    resizeHandlerBound = true;
                }
            }

            function ensureShiftTargets() {
                shiftTargets = CONFIG.shift.targetIds
                    .map(id => document.getElementById(id))
                    .filter(Boolean);

                if (!shiftTargets.length) {
                    console.warn("No pixel-shift target elements found; pixel shift disabled.");
                    return false;
                }

                for (const el of shiftTargets) {
                    el.style.willChange = "transform";
                    el.style.transition = `transform ${CONFIG.shift.transitionMs}ms linear`;
                }

                return true;
            }

            function applyShift(x, y) {
                if (!shiftTargets.length) return;

                for (const el of shiftTargets) {
                    el.style.setProperty("--shift-x", x + "px");
                    el.style.setProperty("--shift-y", y + "px");
                }

                currentShiftX = x;
                currentShiftY = y;
            }

            function pickNewShift() {
                if (!shiftTargets.length) return;

                const max = CONFIG.shift.maxOffsetPx;
                let x = randInt(-max, max);
                let y = randInt(-max, max);

                if (x === currentShiftX && y === currentShiftY) {
                    x = randInt(-max, max);
                    y = randInt(-max, max);
                }

                applyShift(x, y);
            }

            function startPixelShift() {
                if (!CONFIG.shift.enabled) return;
                if (!ensureShiftTargets()) return;
                if (shiftIntervalId) return;

                pickNewShift();
                shiftIntervalId = setInterval(pickNewShift, CONFIG.shift.stepEveryMs);
            }

            function stopPixelShift(resetToZero = false) {
                if (shiftIntervalId) {
                    clearInterval(shiftIntervalId);
                    shiftIntervalId = null;
                }

                if (resetToZero && shiftTargets.length) {
                    applyShift(0, 0);
                }
            }

            function updateShape(shape, dtFactor) {
                for (const p of shape.points) {
                    p.x += p.vx * dtFactor;
                    p.y += p.vy * dtFactor;

                    if (p.x <= 0) {
                        p.x = 0;
                        p.vx *= -1;
                    } else if (p.x >= width) {
                        p.x = width;
                        p.vx *= -1;
                    }

                    if (p.y <= 0) {
                        p.y = 0;
                        p.vy *= -1;
                    } else if (p.y >= height) {
                        p.y = height;
                        p.vy *= -1;
                    }
                }

                shape.trail.unshift(clonePoints(shape.points));
                if (shape.trail.length > CONFIG.mystify.trailLength) {
                    shape.trail.pop();
                }
            }

            function drawClosedShape(points, alpha, hueShift) {
                if (!points || !points.length) return;

                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);

                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }

                ctx.closePath();
                ctx.strokeStyle = `hsla(${hueShift}, 100%, 65%, ${alpha})`;
                ctx.stroke();
            }

            function render() {
                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = "black";
                ctx.fillRect(0, 0, width, height);

                ctx.lineWidth = CONFIG.mystify.lineWidth;
                ctx.lineJoin = "round";
                ctx.lineCap = "round";

                for (const shape of shapes) {
                    for (let i = shape.trail.length - 1; i >= 0; i--) {
                        const alpha = (i + 1) / shape.trail.length;
                        const adjustedAlpha = Math.pow(alpha, 1.8) * 0.85;
                        drawClosedShape(
                            shape.trail[i],
                            adjustedAlpha,
                            (shape.hue + i * 1.5) % 360
                        );
                    }
                }

                if (!lastTs) lastTs = ts;
                const delta = ts - lastTs;

                const dtFactor = Math.min(3, delta / 16.6667);

                for (const shape of shapes) {

                render();
                animationId = requestAnimationFrame(tick);
            }

            function startScreensaver() {

                if (activeScreensaver) return;

                activeScreensaver = true;
                overlay.style.display = "block";
                lastTs = 0;

                stopPixelShift(true);

                if (!shapes.length) {
                    initShapes();
                } else {
                    for (const shape of shapes) {
                        shape.trail = Array.from(
                            { length: CONFIG.mystify.trailLength },
                            () => clonePoints(shape.points)
                        );
                    }
                }

                animationId = requestAnimationFrame(tick);
            }

            function stopScreensaver() {
                activeScreensaver = false;

                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }

                if (overlay) {
                    overlay.style.display = "none";
                }

                startPixelShift();
            }

            function updateState() {
                const shouldRunSaver = isScreensaverTime();

                if (shouldRunSaver) {
                    startScreensaver();
                } else {
                    stopScreensaver();
                }
            }

            function injectMinimalStyles() {
                const style = document.createElement("style");
                style.textContent = `
      #mystify-screensaver-overlay,
      #mystify-screensaver-overlay canvas {
        margin: 0;
        padding: 0;
      }
    `;
                document.head.appendChild(style);
            }

            function boot() {
                injectMinimalStyles();
                ensureOverlay();
                ensureShiftTargets();
                updateState();
                setInterval(updateState, CONFIG.stateCheckIntervalMs);
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", boot, { once: true });
            } else {
                boot();
            }

                        'color': color,
                        'font-weight': 600

                    });
                }, 1000);

                // Fade in/out first dial and rotate
                setTimeout(function () {
                    $('.day-name-preview').fadeTo(500, 0);
                    $('.day-name-text').fadeTo(500, 1, function () {
                        rotateRing(dayName, sectionsDayName, charactersDayName, '#r1', '.day-name-text', dayNameColor);
                    });
                }, 1500);

                // Fade in/out center dial
                setTimeout(function () {
                    $('.center-preview').fadeTo(500, 0);
                    $('.head').fadeTo(500, 0);
                    $('.torso').fadeTo(500, 0);
                    $(".hand-container").fadeTo(500, 1, function () {
                        //console.log("Clock faded in");
                    });
                }, 2000);

                // Begin clock rotation now it is visible
                clockRotation();
            }

            init();
        });
    </script>

    <!-- Build the minute/second tick ring inside the center clock dial -->
    <script>
        (function buildClockTicks() {
            var dial = document.querySelector(".center-dial");
            if (!dial || dial.querySelector(".clock-ticks")) return;

            var svgNS = "http://www.w3.org/2000/svg";
            var svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("class", "clock-ticks");
            svg.setAttribute("viewBox", "0 0 150 150");

            var cx = 75, cy = 75, rOuter = 72;

            for (var i = 0; i < 60; i++) {
                var major = (i % 5 === 0);
                var ang = i * 6 * Math.PI / 180;
                var rInner = major ? 64 : 69;

                var line = document.createElementNS(svgNS, "line");
                line.setAttribute("x1", (cx + rOuter * Math.sin(ang)).toFixed(2));
                line.setAttribute("y1", (cy - rOuter * Math.cos(ang)).toFixed(2));
                line.setAttribute("x2", (cx + rInner * Math.sin(ang)).toFixed(2));
                line.setAttribute("y2", (cy - rInner * Math.cos(ang)).toFixed(2));
                line.setAttribute("stroke", major ? "#cfcfcf" : "#5a5a5a");
                line.setAttribute("stroke-width", major ? "1.6" : "1");
                line.setAttribute("stroke-linecap", "round");
                svg.appendChild(line);
            }

            dial.insertBefore(svg, dial.firstChild);
        })();
    </script>
